[project]
name = "amad-nrp"
version = "0.1.0"
description = "Dynamic point-in-time S&P 100 AMAD Network Risk Parity research engine"
requires-python = ">=3.11"
dependencies = [
  "attrs>=25.3",
  "matplotlib>=3.10",
  "numpy>=2.2",
  "polars>=1.31",
  "pyarrow>=20",
  "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amad_nrp"]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/python"]
